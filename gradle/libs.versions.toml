[versions]
shadow = "9.0.0"
pluginYml = "0.6.0"
runPaper = "2.3.0"

paperApi = "26.2.build.129-stable"
rebar = "0.44.2-26.2"
pylon = "0.42.1-26.2"
libby = "1.3.1"
javet = "5.0.2"
httpclient = "4.5.14"
lombok = "1.18.46"
byteBuddy = "1.18.10"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
rebar = { module = "io.github.pylonmc:rebar", version.ref = "rebar" }
pylon = { module = "io.github.pylonmc:pylon", version.ref = "pylon" }
libby-bukkit = { module = "net.byteflux:libby-bukkit", version.ref = "libby" }

javet = { module = "com.caoccao.javet:javet", version.ref = "javet" }
javet-node-linux-arm64 = { module = "com.caoccao.javet:javet-node-linux-arm64", version.ref = "javet" }
javet-node-linux-x86_64 = { module = "com.caoccao.javet:javet-node-linux-x86_64", version.ref = "javet" }
javet-node-macos-arm64 = { module = "com.caoccao.javet:javet-node-macos-arm64", version.ref = "javet" }
javet-node-macos-x86_64 = { module = "com.caoccao.javet:javet-node-macos-x86_64", version.ref = "javet" }
javet-node-windows-x86_64 = { module = "com.caoccao.javet:javet-node-windows-x86_64", version.ref = "javet" }
javet-v8-linux-arm64 = { module = "com.caoccao.javet:javet-v8-linux-arm64", version.ref = "javet" }
javet-v8-linux-x86_64 = { module = "com.caoccao.javet:javet-v8-linux-x86_64", version.ref = "javet" }
javet-v8-macos-arm64 = { module = "com.caoccao.javet:javet-v8-macos-arm64", version.ref = "javet" }
javet-v8-macos-x86_64 = { module = "com.caoccao.javet:javet-v8-macos-x86_64", version.ref = "javet" }
javet-v8-windows-x86_64 = { module = "com.caoccao.javet:javet-v8-windows-x86_64", version.ref = "javet" }

httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclient" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
byte-buddy = { module = "net.bytebuddy:byte-buddy", version.ref = "byteBuddy" }

[bundles]
javet = [
    "javet",
    "javet-node-linux-arm64",
    "javet-node-linux-x86_64",
    "javet-node-macos-arm64",
    "javet-node-macos-x86_64",
    "javet-node-windows-x86_64",
    "javet-v8-linux-arm64",
    "javet-v8-linux-x86_64",
    "javet-v8-macos-arm64",
    "javet-v8-macos-x86_64",
    "javet-v8-windows-x86_64",
]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
plugin-yml = { id = "net.minecrell.plugin-yml.bukkit", version.ref = "pluginYml" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
